<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Morpheus WebHub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.svg" alt="" class="logo">
    <span class="title">Morpheus WebHub</span>
  </header>

  <div id="statusVersion" class="status-row muted"></div>

  <div id="statusMorpheus" class="status-row"></div>
  <div id="statusNative"   class="status-row"></div>
  <div id="statusPath"     class="status-row status-row-path hidden"></div>
  <div id="statusDetail"   class="status-row status-row-path hidden"></div>

  <section id="tabInfo" class="tab-info hidden">
    <div id="tabTitle" class="tab-title"></div>
    <div id="tabUrl"   class="tab-url"></div>
  </section>

  <section id="targetPicker" class="target-picker hidden">
    <div class="target-picker-title">Send to a specific tab</div>
    <label>
      <span>Board</span>
      <select id="targetBoard"></select>
    </label>
    <label>
      <span>Tab</span>
      <select id="targetTab"></select>
    </label>
  </section>

  <div class="actions">
    <button id="sendBtn" class="btn-primary" disabled>Send to inbox</button>
    <button id="sendToTabBtn" class="btn-secondary" disabled>Send to Tab…</button>
    <button id="importBtn" class="btn-secondary" disabled>Send to Import Manager</button>
  </div>

  <div id="feedback" class="feedback hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
